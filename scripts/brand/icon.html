<!doctype html>
<!--
  Template for the PNG app icons. generate-png-icons.cjs opens it in a
  headless browser with ?size=…&mode=… and screenshots the result.

  mode=any       the rounded tile, transparent corners
  mode=maskable  the square full-bleed tile, the mark inside the 80% safe
                 zone that Android may crop to a circle or a squircle
  mode=apple     the square tile too; iOS rounds the corners itself and
                 draws no transparency
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  img { display: block; }
</style>
</head>
<body>
<img id="icon" alt="">
<script>
  const params = new URLSearchParams(location.search);
  const size = Number(params.get('size') || 512);
  const mode = params.get('mode') || 'any';
  const icon = document.getElementById('icon');
  icon.src = mode === 'any' ? '../../public/brand-icon.svg' : 'brand-icon-square.svg';
  icon.style.width = icon.style.height = size + 'px';
</script>
</body>
</html>
